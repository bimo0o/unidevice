name: Rust validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked --features gui
      - run: cargo +stable clippy --locked --features gui --all-targets -- -D warnings
      - run: cargo +stable build --locked --release --features gui --bins
      - run: cargo +stable run --locked --release --bin unidevice -- demo
      - name: Stage portable GUI
        shell: pwsh
        run: ./scripts/Stage-Gui.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unidevice-gui-${{ matrix.os }}
          path: dist/unidevice-gui/*
